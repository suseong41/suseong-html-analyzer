msapplication-config" content="https://static.lotteon.com/p/common/assets/favicon/1/browserconfig.xml"><link rel="preload" as="style" href="https://static.lotteon.com/p/common/foCommon/foCommon.v1.0.css"><link rel="preload" as="script" href="https://static.lotteon.com/p/common/foCommon/vue_v2_7.min.js"><link rel="preload" as="script" href="https://static.lotteon.com/p/common/foCommon/foCommon.v1.0.umd.min.js"><link rel="preload" as="script" href="https://cdn.fyusion.com/assets/fyu-viewer-latest.js"><link rel="stylesheet" href="https://static.lotteon.com/p/common/foCommon/foCommon.v1.0.css"><link rel="canonical" href="https://www.lotteon.com/p/display/main/lotteon"><script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"Organization","name":"롯데ON","alternateName":"LOTTE ON","url":"https://www.lotteon.com","logo":"https://static.lotteon.com/p/common/foCommon/assets/img/logo_lotte-on_v3@2x.png","contactPoint":{"@type":"ContactPoint","telephone":"+82-1899-7000","contactType":"customer service","areaServed":"KR","availableLanguage":"Korean"},"sameAs":["https://play.google.com/store/apps/details?id=com.lotte&hl=ko","https://apps.apple.com/kr/app/%EB%A1%AF%EB%8D%B0on/id376622474","https://www.instagram.com/lotteon_official","https://www.youtube.com/@LOTTEON_OFFICIAL","https://x.com/Lotte_ON","https://story.lotteon.com"]},{"@type":"FAQPage","mainEntity":[{"@type":"Question","name":"롯데온은 어떤 회사인가요?","acceptedAnswer":{"@type":"Answer","text":"롯데온(Lotte ON)은 대한민국 대표 유통 대기업 롯데그룹이 운영하는 공식 이커머스 플랫폼으로, 롯데백화점·롯데마트·롯데슈퍼·롯데홈쇼핑 등 롯데 계열사의 상품과 서비스를 하나의 플랫폼에서 제공하며, 수십 년간 쌓아온 롯데의 유통 신뢰도와 브랜드 파워를 바탕으로 안전하고 신뢰할 수 있는 쇼핑 환경을 제공합니다."}},{"@type":"Question","name":"롯데온을 이용해야 하는 이유는 무엇인가요?","acceptedAnswer":{"@type":"Answer","text":"롯데온은 롯데백화점의 프리미엄 브랜드부터 롯데마트의 신선식품까지 롯데 계열 오프라인 매장과 온라인을 연계한 올인원 쇼핑 경험을 제공하며, L.POINT 적립·사용으로 혜택이 극대화되고, 롯데카드 등 그룹 금융 서비스와의 연동으로 타 종합몰 대비 차별화된 멤버십 혜택과 할인을 30대/40대/50대 여성 및 남성 고객이 일상적으로 누릴 수 있습니다."}},{"@type":"Question","name":"롯데온에서는 어떤 상품과 서비스를 이용할 수 있나요?","acceptedAnswer":{"@type":"Answer","text":"롯데온에서는 패션·뷰티·식품·생활용품·가전·유아동·스포츠·여행 등 수백만 가지 상품을 판매하며, 롯데백화점 명품 브랜드, 롯데마트 신선식품 배송, 롯데홈쇼핑 단독 기획상품 등 롯데 계열 오프라인 채널의 특화 상품을 온라인에서 편리하게 구매할 수 있어 30대/40대/50대 여성 및 남성의 라이프스타일 전반을 아우르는 원스톱 쇼핑이 가능합니다. 또한 정품 보장되는 공식브랜드관과 백화점 브랜드 상품, 전통시장 상인과의 상생을 위한 온누리상품, 롯데온에서만 구매 가능한 롯데자이언츠 상품과 최저가 여행상품까지 모두 롯데온에서 이용 가능합니다."}},{"@type":"Question","name":"롯데온의 가격대와 구매 방법은 어떻게 되나요?","acceptedAnswer":{"@type":"Answer","text":"롯데온은 수천 원대 생활용품부터 수백만 원대 명품·가전까지 다양한 가격대의 상품을 제공하며, 롯데온 공식 웹사이트(lotteon.com) 또는 롯데온 모바일 앱을 통해 구매할 수 있고, 롯데카드·신용카드·간편결제(L.PAY 등) 등 다양한 결제 수단을 지원하며, 정기적인 특가 행사와 쿠폰·L.POINT 사용으로 더욱 합리적인 가격에 쇼핑할 수 있습니다."}},{"@type":"Question","name":"롯데온의 배송, 반품, 고객 지원 정책은 어떻게 되나요?","acceptedAnswer":{"@type":"Answer","text":"롯데온은 일반 택배배송 외에 당일배송·스마트픽·오늘온다·희망일배송 등의 서비스를 제공하며, 상품 수령 후 7일 이내 단순 변심 반품 및 교환이 가능하고, 상품 하자 발생 시에는 법정 기간 내 무상 처리를 원칙으로 하며, 롯데온 고객센터(1899-7000) 전화 상담, 채팅 상담, 1:1 문의 등 다양한 채널을 통해 신속한 고객 지원을 받을 수 있습니다."}}]}]}</script><script type="module" crossorigin src="https://static.lotteon.com/p/display/assets/js/main/lotteon/main.CRUNcN93.js"></script><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/modulepreload-polyfill.B5Qt9EMX.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/_plugin-vue2_normalizer.DrmMDcu7.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/vite-plugin-node-polyfills.CguK_vYn.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/body-scroll-lock.8S235wFy.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/mitt.DJ65BbbF.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/ua-parser-js.BDFOlYbv.js"><link rel="modulepreload" crossorigin href="https://static.lotteon.com/p/display/assets/js/chunk/lotteon-fo-common-core
